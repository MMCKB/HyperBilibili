name: Build and Release rpk

on:
  push:
    branches:
      - Next
    paths-ignore:
      - '**.md'
      - 'designs/**'
      - 'prototype/**'
  pull_request:
    branches:
      - Next
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，比如 2.5.1。编译完会打 v2.5.1 的 tag 并发 release'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: 编译 ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - label: S3S4
            width: 466
          - label: RW5
            width: 432
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          check-latest: true
          cache: yarn

      - name: 安装依赖
        run: |
          command -v yarn >/dev/null 2>&1 || npm install -g yarn
          yarn --frozen-lockfile --non-interactive

      - name: 编译
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/build.py --width ${{ matrix.width }} --label ${{ matrix.label }}

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: rpk-${{ matrix.label }}
          path: out/*.rpk
          if-no-files-found: error
          retention-days: 14

  release:
    name: 发布 release
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: 打 tag 并发布
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式不对：$VERSION"
            exit 1
          fi
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::${tag} 已经发过了，换个版本号"
            exit 1
          fi
          {
            echo "开发版 ${VERSION}"
            echo
            echo "- 设计宽度 466（S3/S4）"
            echo "- 设计宽度 432（RW5）"
            echo "- 基于提交 ${GITHUB_SHA:0:7} 构建"
          } > release-notes.md
          ls -l release
          gh release create "$tag" release/*.rpk \
            --target "$GITHUB_SHA" \
            --title "澎湃哔哩 ${tag}" \
            --notes-file release-notes.md
